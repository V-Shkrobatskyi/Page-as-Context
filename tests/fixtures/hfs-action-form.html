<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Page as Context HFS action fixture</title></head>
<body><main>
  <h1>Disposable HFS action fixture</h1>
  <p>This page contains synthetic values only. It submits no data and makes no network requests.</p>
  <label>Name <input id="name" type="text" value="Synthetic user"></label>
  <label><input id="checked" type="checkbox"> Enable synthetic option</label>
  <label>Choice <select id="choice"><option>Alpha</option><option>Beta</option></select></label>
  <button id="increment" type="button">Increment synthetic counter</button>
  <p id="counter" role="status">Counter: 0</p>
</main><script>
  let counter = 0;
  document.getElementById('increment').addEventListener('click', () => {
    document.getElementById('counter').textContent = `Counter: ${++counter}`;
  });
</script></body></html>
